name: DNX TDD Red
on:
  push:
    branches: [feat/dnx-native-cli]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust core tests (expected red before implementation)
        run: cargo test --manifest-path wasm/Cargo.toml --test core
      - name: .NET CLI tests (expected red before implementation)
        run: dotnet test dotnet/ImageCompress.Dnx.Tests/ImageCompress.Dnx.Tests.csproj -c Release
